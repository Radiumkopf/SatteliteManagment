name: Build

on: push

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - uses: NuGet/setup-nuget@v2

      - name: Restore packages
        run: nuget restore SatteliteManagment.sln -NonInteractive

      - name: Build Release
        run: msbuild SatteliteManagment.sln /m /p:Configuration=Release '/p:Platform=Any CPU'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SatteliteManagment-${{ github.sha }}
          path: |
            SatteliteManagment/bin/Release/
            !SatteliteManagment/bin/Release/Properties/dbconnect.txt
          if-no-files-found: error
